name: alpha
on:
  push:
    branches:
      - main
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  GO_VERSION: "1.26.0"
jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Check Out Repo
        uses: actions/checkout@v4
      - name: Login to registry
        uses: "docker/login-action@v3.3.0"
        with:
          registry: ${{ env.REGISTRY }}
          password: ${{ secrets.GITHUB_TOKEN }}
          username: ${{ github.actor }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5.5.1
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
      - name: Build and push Docker image
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:alpha
          labels: ${{ steps.meta.outputs.labels }}
  binaries:
    strategy:
      matrix:
        include:
          - goarch: amd64
            name: x86_64
          - goarch: arm64
            name: arm64
    runs-on: ubuntu-latest
    steps:
      - name: Check Out Repo
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Build frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
      - name: Build binary
        env:
          CGO_ENABLED: 0
        run: |
          VERSION="${GITHUB_SHA::7}"
          go build -ldflags "-X github.com/convos-chat/convos/pkg/version.Version=${VERSION}" \
            -o convos-convos-linux-${{ matrix.name }} convos.go
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: convos-linux-${{ matrix.name }}
          path: convos-convos-linux-${{ matrix.name }}
          if-no-files-found: error

